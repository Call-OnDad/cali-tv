<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cali</title>
<style>
  :root { --accent:#00d4ff; --bad:#ff5a6e; --warn:#ffb020; --ok:#38d87a; --mut:#8a8fa3; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#07070F; color:#f2f3f7;
    font-family:"Segoe UI",Roboto,Arial,sans-serif; overflow:hidden; }
  body { padding:4vh 5vw; display:flex; flex-direction:column; gap:3vh; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .clock { font-size:5.5vh; font-weight:600; letter-spacing:1px; }
  .date { font-size:2.2vh; color:var(--mut); margin-top:0.5vh; }
  .brand { font-size:2.6vh; color:var(--accent); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:2.5vh; flex:1; min-height:0; }
  .tile { background:#13131f; border:1px solid #23243a; border-radius:14px;
    padding:2.5vh 3vw; display:flex; flex-direction:column; gap:1vh; overflow:hidden; }
  .tile:focus { outline:3px solid var(--accent); }
  .tile h2 { margin:0; font-size:2.1vh; font-weight:500; color:var(--mut); text-transform:uppercase; letter-spacing:1px; }
  .tile .big { font-size:3.4vh; font-weight:600; }
  .tile .sub { font-size:1.9vh; color:var(--mut); }
  .row { display:flex; justify-content:space-between; align-items:baseline; font-size:2vh; padding:0.6vh 0; border-top:1px solid #1d1e30; }
  .row:first-of-type { border-top:none; }
  .dot { display:inline-block; width:1.1vh; height:1.1vh; border-radius:50%; margin-right:1vh; }
  .ok   { color:var(--ok); }
  .warn { color:var(--warn); }
  .bad  { color:var(--bad); }
  .empty { color:var(--mut); font-size:1.9vh; }
  .status { position:absolute; bottom:1.5vh; right:2vw; font-size:1.5vh; color:var(--mut); }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="brand">Cali</div>
  </div>
  <div class="grid">
    <div class="tile" tabindex="0" id="tile-alerts">
      <h2>Alerts</h2>
      <div class="sub">Loading…</div>
    </div>
    <div class="tile" tabindex="0" id="tile-machine">
      <h2>Homelab</h2>
      <div class="sub">Loading…</div>
    </div>
    <div class="tile" tabindex="0" id="tile-weather">
      <h2>Weather</h2>
      <div class="sub">Loading…</div>
    </div>
    <div class="tile" tabindex="0" id="tile-calendar">
      <h2>Today</h2>
      <div class="sub">Loading…</div>
    </div>
  </div>
  <div class="status" id="status"></div>
  <script src="tv.js"></script>
</body>
</html>
